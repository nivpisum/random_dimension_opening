modLoader="javafml"
loaderVersion="[47,48)"
license="CC0-1.0"

[[mods]]
modId="randimopen"
version="${version}"
displayName="RandomDimensionOpening | 随机维度开局"
authors="nivpisum (SnowyPea)"
logoFile="logo.png"
displayTest="IGNORE_SERVER_VERSION"
description='''
Start together in a randomly chosen dimension. Every loaded dimension has an equal chance, and one shared world spawn is saved. Positions near the origin are more likely; vanilla terrain search resolves the landing. First-time players and respawns without a valid personal point use that shared start. Beds, respawn anchors and vanilla spawn rules keep their normal priority. No artificial platforms. Multiplayer: install on the server; clients do not need this mod.

随机维度开局：从世界全部已加载维度中等概率选择一个共同开局，选定后保存，不因重开或新增维度而重抽。靠近原点的候选位置概率更高，实际落点由原版搜索天然地形。新玩家首次出生、没有有效个人重生点时共用该起点；床、重生锚、强制个人出生点和出生散布继续采用原版规则，不制造人工平台。联机服务器安装，客户端无需本模组；仍可能在危险地形或虚空开局。
'''

[[dependencies.randimopen]]
modId="forge"
mandatory=true
versionRange="[47.4.23,48)"
ordering="NONE"
side="BOTH"

[[dependencies.randimopen]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1]"
ordering="NONE"
side="BOTH"
